repos:
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        args: ["--all"]
        pass_filenames: false
      - id: cargo-check
        args: ["--workspace"]
        pass_filenames: false
      - id: clippy
        args: ["--workspace", "--all-targets", "--", "-D", "warnings"]
        pass_filenames: false
